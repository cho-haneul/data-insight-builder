<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 다크 프리미엄 배경 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- 1. 빨간색(Red) 그라데이션 막대 -->
    <linearGradient id="redBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>

    <!-- 2. 노란색(Yellow) 그라데이션 막대 -->
    <linearGradient id="yellowBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- 3. 파란색(Blue) 그라데이션 막대 -->
    <linearGradient id="blueBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- 상승 추세선 그라데이션 (화이트/시안 빛) -->
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- 입체감 섀도우 필터 -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 배경 둥근 사각형 -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- 배경 가이드 격자선 -->
  <line x1="74" y1="400" x2="438" y2="400" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round"/>
  <line x1="74" y1="310" x2="438" y2="310" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="74" y1="220" x2="438" y2="220" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="74" y1="130" x2="438" y2="130" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- 빨강, 노랑, 파랑 3색 차트 막대 -->
  <!-- 1. 빨간색 막대 (Red Bar) -->
  <rect x="96" y="240" width="80" height="160" rx="18" fill="url(#redBar)" filter="url(#glowShadow)"/>
  
  <!-- 2. 노란색 막대 (Yellow Bar) -->
  <rect x="216" y="160" width="80" height="240" rx="18" fill="url(#yellowBar)" filter="url(#glowShadow)"/>

  <!-- 3. 파란색 막대 (Blue Bar - 최고점) -->
  <rect x="336" y="90" width="80" height="310" rx="18" fill="url(#blueBar)" filter="url(#glowShadow)"/>

  <!-- 상승 곡선 추세선 (Trend Line) -->
  <path d="M 136 215 C 190 190, 210 135, 256 135 C 300 135, 330 75, 376 65" 
        fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" filter="url(#glowShadow)"/>

  <!-- 추세선 위 3대 하이라이트 노드 포인트 -->
  <!-- Red Node -->
  <circle cx="136" cy="215" r="14" fill="#ffffff" filter="url(#glowShadow)"/>
  <circle cx="136" cy="215" r="7" fill="#ef4444"/>

  <!-- Yellow Node -->
  <circle cx="256" cy="135" r="16" fill="#ffffff" filter="url(#glowShadow)"/>
  <circle cx="256" cy="135" r="8" fill="#f59e0b"/>

  <!-- Blue Node -->
  <circle cx="376" cy="65" r="18" fill="#ffffff" filter="url(#glowShadow)"/>
  <circle cx="376" cy="65" r="9" fill="#3b82f6"/>

  <!-- AI 인사이트 반짝임 스타 (좌측 상단 & 우측 상단) -->
  <path d="M 75 90 L 80 105 L 95 110 L 80 115 L 75 130 L 70 115 L 55 110 L 70 105 Z" fill="#fbbf24" opacity="0.9"/>
  <path d="M 435 150 L 439 162 L 451 166 L 439 170 L 435 182 L 431 170 L 419 166 L 431 162 Z" fill="#60a5fa" opacity="0.8"/>
</svg>
