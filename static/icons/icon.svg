<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="80" y1="380" x2="432" y2="380" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="290" x2="432" y2="290" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="80" y1="200" x2="432" y2="200" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Chart Bars -->
  <!-- Bar 1 -->
  <rect x="110" y="270" width="52" height="110" rx="14" fill="url(#barGrad1)" filter="url(#shadow)"/>
  <!-- Bar 2 (Key Highlight - Orange) -->
  <rect x="190" y="150" width="52" height="230" rx="14" fill="url(#barGrad2)" filter="url(#shadow)"/>
  <!-- Bar 3 -->
  <rect x="270" y="220" width="52" height="160" rx="14" fill="url(#barGrad1)" filter="url(#shadow)"/>
  <!-- Bar 4 -->
  <rect x="350" y="180" width="52" height="200" rx="14" fill="url(#barGrad1)" filter="url(#shadow)"/>

  <!-- Trend Curve Line -->
  <path d="M 136 250 Q 216 110 296 190 T 376 140" fill="none" stroke="url(#accentLine)" stroke-width="10" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Sparkle Node on Top -->
  <circle cx="216" cy="130" r="14" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="216" cy="130" r="7" fill="#f59e0b"/>
  <circle cx="376" cy="140" r="10" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="376" cy="140" r="5" fill="#10b981"/>

  <!-- AI Sparkle Icon on Top-Right -->
  <path d="M 400 70 L 408 92 L 430 100 L 408 108 L 400 130 L 392 108 L 370 100 L 392 92 Z" fill="#fde68a"/>
</svg>
